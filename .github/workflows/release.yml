name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -q pytest -r requirements.txt
          python -m pytest -q tests
      - name: Build app
        run: PYTHON=python ./scripts/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: 3DS-Pad-mac
          path: dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
