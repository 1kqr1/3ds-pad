<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1d22">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.png">
<title>3DS Pad</title>
<style>
:root{--bg:#1b1d22;--btn:#2d3038;--btn2:#3a3e48;--on:#e8505b;--fg:#e9e9ee;--sub:#8a8f9c;--u:3.6px}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;position:fixed;inset:0}
#scr{position:absolute;top:0;background:#000;border-radius:4px;display:block;touch-action:none}
.side{position:absolute;top:0;height:100%}
.c{position:absolute;transform:translate(-50%,-50%)}
.btn{display:flex;align-items:center;justify-content:center;background:var(--btn);border-radius:50%;font-weight:700;color:var(--fg);box-shadow:0 2px 0 #0006}
.btn.on{background:var(--on)}
.sh{border-radius:calc(var(--u)*2.5);width:44%;height:calc(var(--u)*10);font-size:calc(var(--u)*3.6)}
.face{width:calc(var(--u)*14);height:calc(var(--u)*14);font-size:calc(var(--u)*5)}
.sm{border-radius:calc(var(--u)*4);width:40%;height:calc(var(--u)*8);font-size:calc(var(--u)*3);background:var(--btn2)}
#dpad{width:calc(var(--u)*30);height:calc(var(--u)*30)}
#dpad div{position:absolute;background:var(--btn);border-radius:6px}
#dpad .v{left:33%;width:34%;height:100%}#dpad .h{top:33%;height:34%;width:100%}
#dpad .seg{background:transparent;pointer-events:none}
#dpad .seg.on{background:var(--on)}
#cpad{width:calc(var(--u)*27);height:calc(var(--u)*27);border-radius:50%;background:var(--btn2)}
#knob{position:absolute;width:45%;height:45%;left:27.5%;top:27.5%;border-radius:50%;background:#555b68}
#msg{position:fixed;left:0;right:0;top:40%;text-align:center;color:var(--sub);font-size:14px;pointer-events:none}
</style></head><body>
<div class="side" id="left">
  <div class="btn sh c" data-b="L" style="left:26%;top:calc(var(--u)*7)">L</div>
  <div class="btn sh c" data-b="ZL" style="left:74%;top:calc(var(--u)*7)">ZL</div>
  <div id="cpad" class="c" style="left:50%;top:calc(var(--u)*31)"><div id="knob"></div></div>
  <div id="dpad" class="c" style="left:50%;top:calc(var(--u)*65)"><div class="v"></div><div class="h"></div>
    <div class="seg" id="sUP" style="left:33%;top:0;width:34%;height:33%"></div>
    <div class="seg" id="sDOWN" style="left:33%;bottom:0;width:34%;height:33%"></div>
    <div class="seg" id="sLEFT" style="left:0;top:33%;width:33%;height:34%"></div>
    <div class="seg" id="sRIGHT" style="right:0;top:33%;width:33%;height:34%"></div>
  </div>
  <div class="btn sm c" data-b="SELECT" style="left:27%;top:calc(var(--u)*91)">SELECT</div>
  <div class="btn sm c" data-b="HOME" style="left:73%;top:calc(var(--u)*91)">HOME</div>
</div>
<canvas id="scr" width="640" height="480"></canvas>
<div class="side" id="right">
  <div class="btn sh c" data-b="ZR" style="left:26%;top:calc(var(--u)*7)">ZR</div>
  <div class="btn sh c" data-b="R" style="left:74%;top:calc(var(--u)*7)">R</div>
  <div class="btn face c" data-b="X" style="left:50%;top:calc(var(--u)*32)">X</div>
  <div class="btn face c" data-b="Y" style="left:calc(50% - var(--u)*15.5);top:calc(var(--u)*48)">Y</div>
  <div class="btn face c" data-b="A" style="left:calc(50% + var(--u)*15.5);top:calc(var(--u)*48)">A</div>
  <div class="btn face c" data-b="B" style="left:50%;top:calc(var(--u)*64)">B</div>
  <div class="btn sm c" data-b="START" style="left:27%;top:calc(var(--u)*91)">START</div>
  <div class="btn sm c" id="fs" style="left:73%;top:calc(var(--u)*91)">全画面</div>
</div>
<div id="msg">接続中…</div>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
const k=new URLSearchParams(location.search).get('k');
const cv=document.getElementById('scr'),ctx=cv.getContext('2d'),msg=document.getElementById('msg');
const L=document.getElementById('left'),R=document.getElementById('right');

/* 実際に見えている画面サイズからレイアウトを計算（下が切れないように） */
function layout(){
  const W=window.innerWidth,H=window.innerHeight;
  let h=H,w=h*4/3;
  if(w>W*0.56){w=W*0.56;h=w*3/4}
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.style.left=(W-w)/2+'px';cv.style.top=(H-h)/2+'px';
  const side=(W-w)/2;
  L.style.left='0px';L.style.width=side+'px';
  R.style.left=(W-side)+'px';R.style.width=side+'px';
  const u=Math.min(H/100,(side-8)/46);
  document.documentElement.style.setProperty('--u',u+'px');
  L.style.height=R.style.height=(u*100)+'px';
  L.style.top=R.style.top=((H-u*100)/2)+'px';
}
layout();addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,300));
if(window.visualViewport)visualViewport.addEventListener('resize',layout);

let ws;
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function buzz(){if(navigator.vibrate)navigator.vibrate(12)}
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws?k=${k}`);ws.binaryType='arraybuffer';
  ws.onopen=()=>{msg.textContent='下画面を待機中…（Azaharでゲームを起動）'};
  ws.onmessage=async e=>{msg.textContent='';const bmp=await createImageBitmap(new Blob([e.data],{type:'image/jpeg'}));ctx.drawImage(bmp,0,0,640,480);bmp.close&&bmp.close()};
  ws.onclose=()=>{msg.textContent='Macに接続できません。Macで「3DS Pad」が起動しているか確認してください（自動で再接続します）';setTimeout(connect,1500)};
}
connect();

/* 下画面タッチ */
let tid=null;
function rel(t){const r=cv.getBoundingClientRect();return{x:(t.clientX-r.left)/r.width,y:(t.clientY-r.top)/r.height}}
cv.addEventListener('touchstart',e=>{e.preventDefault();if(tid!==null)return;const t=e.changedTouches[0];tid=t.identifier;send({t:'td',...rel(t)})},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===tid)send({t:'tm',...rel(t)})},{passive:false});
function tend(e){e.preventDefault();for(const t of e.changedTouches)if(t.identifier===tid){send({t:'tu',...rel(t)});tid=null}}
cv.addEventListener('touchend',tend,{passive:false});cv.addEventListener('touchcancel',tend,{passive:false});

/* 通常ボタン */
document.querySelectorAll('[data-b]').forEach(el=>{
  const b=el.dataset.b;
  const on=e=>{e.preventDefault();if(el.classList.contains('on'))return;el.classList.add('on');buzz();send({t:'k',b,d:1})};
  const off=e=>{e.preventDefault();el.classList.remove('on');send({t:'k',b,d:0})};
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});el.addEventListener('touchcancel',off,{passive:false});
});

/* 方向入力（十字キー・スライドパッド共通） */
function dirArea(el,prefix,dead,onMove){
  let id=null,cur=new Set();
  const set=(dirs)=>{for(const d of ['UP','DOWN','LEFT','RIGHT']){const want=dirs.has(d);if(want!==cur.has(d)){send({t:'k',b:prefix+d,d:want?1:0});if(want)buzz()}}cur=dirs};
  const calc=t=>{const r=el.getBoundingClientRect();const dx=(t.clientX-r.left)/r.width*2-1,dy=(t.clientY-r.top)/r.height*2-1;
    const s=new Set();const m=Math.hypot(dx,dy);if(m>dead){const a=Math.atan2(dy,dx)*180/Math.PI;
      if(a>-67.5&&a<67.5)s.add('RIGHT');if(a>112.5||a<-112.5)s.add('LEFT');if(a>22.5&&a<157.5)s.add('DOWN');if(a<-22.5&&a>-157.5)s.add('UP')}
    onMove&&onMove(dx,dy,s);return s};
  el.addEventListener('touchstart',e=>{e.preventDefault();if(id!==null)return;const t=e.changedTouches[0];id=t.identifier;set(calc(t))},{passive:false});
  el.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===id)set(calc(t))},{passive:false});
  const end=e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===id){id=null;set(new Set());onMove&&onMove(0,0,new Set())}};
  el.addEventListener('touchend',end,{passive:false});el.addEventListener('touchcancel',end,{passive:false});
}
dirArea(document.getElementById('dpad'),'',0.25,(dx,dy,s)=>{for(const d of ['UP','DOWN','LEFT','RIGHT'])document.getElementById('s'+d).classList.toggle('on',s.has(d))});
const knob=document.getElementById('knob');
dirArea(document.getElementById('cpad'),'C',0.3,(dx,dy)=>{const m=Math.min(1,Math.hypot(dx,dy))/(Math.hypot(dx,dy)||1);knob.style.transform=`translate(${dx*m*60}%,${dy*m*60}%)`});

/* 全画面＋横向き固定 */
document.getElementById('fs').addEventListener('touchend',async e=>{e.preventDefault();try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}catch(err){}setTimeout(layout,300)},{passive:false});
</script></body></html>
